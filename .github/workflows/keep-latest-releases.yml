name: Keep latest 2 releases only

"on":
  release:
    types: [published]

permissions:
  contents: write

jobs:
  keep-latest-2:
    runs-on: ubuntu-latest
    steps:
      - name: Delete releases older than the latest 2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tags=$(gh release list --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[].tagName')
          echo "Releases (newest first):"
          echo "$tags"
          echo "$tags" | tail -n +3 | while read -r tag; do
            [ -n "$tag" ] || continue
            echo "Deleting release $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done
