name: Keep latest 2 releases only

"on":
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep-latest-2:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        # Needed so the shared .github/actions/gh-release action below
        # is available on the runner.
        uses: actions/checkout@v4

      - name: Delete releases older than the latest 2
        uses: ./.github/actions/gh-release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            set -euo pipefail
            # List up to 1000 releases so the keep-2 policy does not silently stop after 100 releases.
            # Sort by tag name, newest first: CalVer tags sort
            # lexicographically in the same order as chronologically,
            # which is more robust than createdAt if a release is ever
            # published out of order.
            # gh targets this repo through the shared action (GH_REPO);
            # do not pass --repo here.
            tags=$(gh release list --limit 1000 --json tagName --jq 'sort_by(.tagName) | reverse | .[].tagName')
            echo "Releases (newest first):"
            echo "$tags"
            # The loop reads from a here-string, not a pipe, so it runs
            # in this shell and a failed delete is not silently masked:
            # the pipeline's exit status would be the last iteration's.
            fail=0
            while read -r tag; do
              [ -n "$tag" ] || continue
              echo "Deleting release $tag"
              gh release delete "$tag" --yes --cleanup-tag || fail=1
            done <<< "$(printf '%s\n' "$tags" | tail -n +3)"
            exit "$fail"
