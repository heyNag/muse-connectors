# Manual release workflow.
#
# Publishing a release here automatically triggers the keep-latest-2
# workflow, which keeps only the latest 2 releases (and their tags).
# This workflow does NOT bump versions in files: the version in
# connectors/bookmyshow/connector.yaml and in the version lines in
# connectors/bookmyshow/CONNECTOR.md and connectors/bookmyshow/README.md
# must already match the version entered below, or this run fails.
#
# Releases are created ONLY through this workflow (see CONTRIBUTING.md).
# That is a convention, not an enforcement — GitHub cannot block direct
# release creation; this workflow is the path we use.
# The gh calls below run through the shared .github/actions/gh-release
# action, which is the one place that targets this repo.
name: Manual release

"on":
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 2026.11.22.5 — must match the version in connector.yaml"
        required: true
        type: string
      notes:
        description: "Release notes; defaults to a short generic note if empty"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Create the release
        uses: ./.github/actions/gh-release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            set -euo pipefail

            # 1. Version format: date-based CalVer YYYY.MM.DD, with an
            #    optional .N for extra releases the same day.
            if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$'; then
              echo "ERROR: version '$VERSION' is not a valid CalVer version."
              echo "Expected e.g. 2026.11.22.5 (YYYY.MM.DD, with an optional .N)."
              exit 1
            fi

            # 2. Fail if the tag / release already exists.
            #    Check both the release and the tag: an orphan tag with
            #    no release would otherwise only fail later, at
            #    `gh release create`, with a less clear error.
            if gh release view "$VERSION" >/dev/null 2>&1; then
              echo "ERROR: release '$VERSION' already exists."
              echo "Pick a new version (bump the version in the files first) and try again."
              exit 1
            fi
            if gh api "repos/$GH_REPO/git/ref/tags/$VERSION" >/dev/null 2>&1; then
              echo "ERROR: tag '$VERSION' already exists (with no release)."
              echo "Pick a new version (bump the version in the files first) and try again."
              exit 1
            fi

            # 3. The version in all three version files must already match
            #    the input. This workflow does not bump versions in files.
            #    NOTE: this check is BookMyShow-specific — it reads the
            #    BookMyShow connector's files. When a second connector
            #    lands, generalise it to check that connector's files too.
            check_version_file() {
              file="$1"
              pattern="$2"
              found=$(grep -E "$pattern" "$file" | grep -oE '[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?' | head -n 1 || true)
              if [ "$found" != "$VERSION" ]; then
                echo "ERROR: $file version is '${found:-(none found)}', but you asked to release '$VERSION'."
                mismatched=1
              fi
            }
            mismatched=0
            check_version_file "connectors/bookmyshow/connector.yaml" '^version:'
            check_version_file "connectors/bookmyshow/CONNECTOR.md" 'Current version:'
            check_version_file "connectors/bookmyshow/README.md" '^- Version:'
            if [ "$mismatched" -ne 0 ]; then
              echo "Bump the version in connector.yaml and in the version lines in CONNECTOR.md and README.md first, commit and push it, then run this workflow again."
              exit 1
            fi

            # 4. Create the release on main.
            #    --target main pins the release to main even if this
            #    workflow was dispatched from another branch.
            if [ -z "$NOTES" ]; then
              NOTES="Release $VERSION."
            fi
            gh release create "$VERSION" --target main --title "$VERSION" --notes "$NOTES"
            echo "Released $VERSION."
        env:
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
